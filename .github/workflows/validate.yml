name: validate
on:
  pull_request:
  push:
    branches: [main]
jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check SKILL.md frontmatter and directory names
        run: |
          python3 - << 'PY'
          import pathlib, re, sys, json
          bad = []
          for skill in pathlib.Path('skills').glob('*/SKILL.md'):
              text = skill.read_text()
              m = re.match(r'---\n(.*?)\n---', text, re.S)
              if not m: bad.append(f'{skill}: no frontmatter'); continue
              fm = m.group(1)
              name = re.search(r'^name:\s*"?([^"\n]+)"?', fm, re.M)
              if not name or name.group(1).strip() != skill.parent.name:
                  bad.append(f'{skill}: name must equal directory {skill.parent.name}')
              if not re.search(r'^description:', fm, re.M): bad.append(f'{skill}: missing description')
              if not re.match(r'^[a-z0-9-]+$', skill.parent.name): bad.append(f'{skill}: directory must be kebab-case')
          for f in ['.claude-plugin/plugin.json', '.claude-plugin/marketplace.json']:
              json.load(open(f))
          if bad: print('\n'.join(bad)); sys.exit(1)
          print('ok')
          PY
      - name: No secrets or live endpoints
        run: |
          ! grep -rEn "m\.pipedream\.net|run\.app" --include=*.md --include=*.py --include=*.json . | grep -v "YOUR-TRIGGER\|XXXX" || (echo "live endpoint found" && exit 1)
      - name: MCP server compiles
        run: python3 -m py_compile mcp/server.py
